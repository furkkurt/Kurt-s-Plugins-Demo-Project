<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for RPGMZ playtest under Proton/Pressure Vessel (avoids broken host fonts.conf). -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/share/fonts/TTF</dir>
  <dir>/usr/share/fonts/truetype</dir>
  <dir>/usr/share/fonts/opentype</dir>
  <cachedir>/tmp/rmmz-fontconfig-cache</cachedir>
  <config></config>
</fontconfig>
